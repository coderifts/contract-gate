name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1364. The note here used to say "zero dependencies ... imports only Node builtins", and
      # that was not true of the tests: three describe blocks in test/readback.test.js required a
      # JSON-Schema validator through an ABSOLUTE path into a sibling private checkout
      # (/Users/<developer>/coderifts-app/node_modules/ajv). That path exists on one machine. On a
      # runner it does not, so those blocks threw at suite load and took the run with them.
      #
      # The RUNTIME is still dependency-free — the Action ships vendored verify.js and Node
      # builtins only, and `dependencies` in package.json is still empty. ajv is a devDependency
      # used by the test suite alone, and a lockfile is committed so `npm ci` can be exact.
      - name: Install
        run: npm ci

      # The only gate this repo defines. node --test discovers test/*.test.js.
      - name: Test (node --test)
        run: npm test

      # v0.5.0, v0.6.0 and v0.7.0 were all tagged with no CHANGELOG section. This repo releases
      # by bumping package.json in its own commit and moving a tag, and nothing in that path
      # read the CHANGELOG — so the omission was free at the time and expensive afterwards.
      # Running it here catches the bump commit when it lands.
      - name: CHANGELOG names the current version
        run: npm run release:check
