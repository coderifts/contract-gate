name: 'CodeRifts Contract Gate'
description: 'Blocks a merge unless a signed ALLOW receipt verifies offline against a pinned keyring for the PR''s actual head diff. With require_verified_monitoring: true the gate verifies a cr.monitor.attest.v1 token offline against a pinned monitoring keyring (CWM passes only on delivered_acked); by default it passes CWM on the host''s claim.'
author: 'CodeRifts'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  api-key:
    description: 'CodeRifts API key (used only to request a signed preflight receipt).'
    required: true
  api-url:
    description: 'CodeRifts API base URL.'
    required: false
    default: 'https://app.coderifts.com'
  github-token:
    description: 'Token with checks:write to post the "CodeRifts / contract-gate" Check Run.'
    required: false
    default: ${{ github.token }}
  require-verified-monitoring:
    description: 'When true, CONTINUE_WITH_MONITORING passes only if a cr.monitor.attest.v1 token verifies offline (MON_ATTEST_VALID or retired-in-window) AND delivery_status is delivered_acked. Unsigned JSON is not accepted. Default false (existing consumers unchanged).'
    required: false
    default: 'false'
  monitoring-attestation:
    description: 'cr.monitor.attest.v1 token string (guard 9.2.0+ outcome.monitoring_attestation). Required when require-verified-monitoring is true and the decision is CWM. No network fetch.'
    required: false
    default: ''
  monitoring-keyring:
    description: 'Local JSON file path for the customer-pinned monitoring-key registry ({ keys: [{ kid, public_key_pem, status, valid_from, retired_at }] }). Same shape as the receipt keyring / .well-known/coderifts-keys.json. Local file only — no fetch.'
    required: false
    default: ''

# The receipt is ALWAYS verified offline against the keyring pinned in this action
# (keyring/pinned-keys.json). The gate NEVER fetches the verification key from the server it is
# verifying. Requires actions/checkout with fetch-depth: 0 so base..head is available locally.
runs:
  using: 'node20'
  main: 'src/index.js'
